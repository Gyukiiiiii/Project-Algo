<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Navigasi Rute</title>
    <meta name="description" content="Aplikasi pencarian rute terpendek dan ternyaman Universitas Jember">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Navigasi Berdasarkan Jarak Dan Kenyamanan</h1>
            <p class="subtitle">Sistem Pencarian Rute </p>
        </header>

        <main class="glass-card">
            <form id="navForm">
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="startNode">Titik Asal</label>
                        <select id="startNode" name="startNode" required>
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label for="destNode">Titik Tujuan</label>
                        <select id="destNode" name="destNode" required>
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Jenis Kendaraan</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="vehicle" value="Mobil" checked> Mobil
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="vehicle" value="Motor"> Motor
                        </label>
                    </div>
                </div>

                <button type="submit" id="btnSearch">Cari Rute Optimal</button>
            </form>
        </main>

        <section id="graphPreview" class="glass-card graph-card">
            <div class="graph-title">Visualisasi Graf Rute</div>
            <svg id="graphSvg" viewBox="0 0 520 420" aria-label="Visualisasi graf rute" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="var(--text-muted)" font-size="16">
                    Pilih titik asal, tujuan, lalu klik Cari Rute untuk menampilkan graf.
                </text>
            </svg>
        </section>

        <section id="results" class="glass-card">
            <!-- Results will be injected here by JS -->
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
